server {
    listen 80;
    server_name sundownswpa.duckdns.org;

    location /common/health/ {
        access_log off;
        return 200 "healthy\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name sundownswpa.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/sundownswpa.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sundownswpa.duckdns.org/privkey.pem;

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }

    location / {
        resolver 127.0.0.11 valid=30s;
        set $upstream_web web:8000;

        proxy_pass http://$upstream_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}