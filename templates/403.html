<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feature Frozen</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900">
    <main class="min-h-screen flex items-center justify-center px-4">
        <div class="max-w-xl w-full rounded-lg border border-yellow-300 bg-white p-8 shadow-sm">
            <div class="mb-4 inline-flex items-center rounded-full bg-yellow-100 px-3 py-1 text-sm font-semibold text-yellow-800">
                Temporarily unavailable
            </div>
            <h1 class="text-3xl font-bold text-gray-900">This feature is currently frozen.</h1>
            <p class="mt-4 text-gray-700">
                {{ message|default:"This feature is temporarily unavailable while the product team keeps it offline." }}
            </p>
            {% if feature %}
                <p class="mt-2 text-sm text-gray-600">Feature: {{ feature|title }}</p>
            {% endif %}
            <div class="mt-6">
                <a href="/dashboard/" class="inline-flex items-center rounded bg-yellow-500 px-4 py-2 font-medium text-green-900 hover:bg-yellow-400">
                    Return to dashboard
                </a>
            </div>
        </div>
    </main>
</body>
</html>
