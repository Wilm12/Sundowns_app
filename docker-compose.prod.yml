version: '3.8'

services:
  db:
    env_file:
      - .env.prod
    environment:
      POSTGRES_DB: sundowns_prod
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: securepassword
    restart: unless-stopped

  web:
    command: gunicorn sundowns_app.wsgi:application --bind 0.0.0.0:8000 --workers 1 --timeout 120 --access-logfile -
    env_file:
      - .env.prod
    expose:
    - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/common/health/').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - db
      - redis
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
      - /etc/letsencrypt:/etc/letsencrypt:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/common/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - web
    restart: unless-stopped

