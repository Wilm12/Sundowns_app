{% extends "base.html" %}

{% block title %}Login | BranchRoute{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white rounded-lg shadow p-8">

    <h1 class="text-2xl font-bold text-brand-primary mb-6">
        Login
    </h1>

    <form method="POST" class="space-y-4">
        {% csrf_token %}

        <div>
            <label class="block mb-1 font-medium">
                Email
            </label>

            <input
                type="email"
                name="email"
                autocomplete="email"
                class="w-full border rounded px-4 py-2"
                required
            >
        </div>

        <div>
            <label class="block mb-1 font-medium">
                Password
            </label>

            <input
                type="password"
                name="password"
                class="w-full border rounded px-4 py-2"
                required
            >
        </div>

        <button
            type="submit"
            class="w-full bg-brand-secondary text-white py-3 rounded font-semibold hover:bg-blue-500 focus:outline-none focus:ring-2 focus:ring-brand-accent"
        >
            Login
        </button>
    </form>

</div>
{% endblock %}
