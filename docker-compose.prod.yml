version: '3.8'

services:
  db:
    env_file:
      - .env.prod
    environment:
      POSTGRES_DB: sundowns_prod
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: securepassword
    restart: unless-stopped

  web:
    command: gunicorn sundowns_app.wsgi:application --bind 0.0.0.0:8000 --workers 1 --timeout 120 --access-logfile -
    env_file:
      - .env.prod
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import os, django; os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'sundowns_app.settings.prod'); django.setup(); from django.db import connection; connection.ensure_connection(); print('healthy')"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - db
      - redis
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
      - /etc/letsencrypt:/etc/letsencrypt:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/common/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - web
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  grafana_data:
